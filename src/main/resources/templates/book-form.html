<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Pievienot grāmatu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <h1>Pievienot grāmatu</h1>

    <form method="post" th:action="@{/books}" th:object="${bookForm}">
        <div>
            <label for="title">Nosaukums</label>
            <input type="text" id="title" th:field="*{title}" required>
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div>
            <label for="author">Autors</label>
            <input type="text" id="author" th:field="*{author}" required>
            <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </div>

        <div>
            <label for="publicationYear">Izdošanas gads</label>
            <input type="number" id="publicationYear" th:field="*{publicationYear}" required min="1">
            <span class="error" th:if="${#fields.hasErrors('publicationYear')}" th:errors="*{publicationYear}"></span>
        </div>

        <div>
            <label for="description">Apraksts</label>
            <textarea id="description" th:field="*{description}" rows="5"></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>

        <div>
            <label for="categoryId">Kategorija</label>
            <select id="categoryId" th:field="*{categoryId}" required>
                <option value="">Izvēlieties kategoriju</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
        </div>

        <button type="submit">Saglabāt</button>
    </form>

    <p><a th:href="@{/books}">Atpakaļ uz sarakstu</a></p>
</main>
</body>
</html>
